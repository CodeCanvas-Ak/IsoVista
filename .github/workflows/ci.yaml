name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

env:
  TZ: Asia/Shanghai
  JAVA_TOOL_OPTIONS: -Xmx3g -Duser.timezone=Asia/Shanghai

jobs:
  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: "11"
          distribution: temurin
          cache: maven
      # The full solver suite additionally requires a compatible native MonoSAT runtime.
      - name: Run isolated Java regressions
        run: mvn -B -Dtest=MainTest,HistoryLoaderSerializerTest,ElleTest,RuntimeDataSerializerTest test
      - name: Package the shaded JAR
        run: mvn -B -DskipTests package

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Check syntax and run isolated regressions
        run: |
          python -m compileall -q backend
          python -m unittest backend.test_main

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Build the frontend
        run: npm run build
